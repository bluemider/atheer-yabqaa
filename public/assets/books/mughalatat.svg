<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMughalatat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F382C" />
      <stop offset="60%" stop-color="#09241C" />
      <stop offset="100%" stop-color="#04120E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>
  <rect width="500" height="720" rx="12" fill="url(#bgMughalatat)" />
  <rect x="25" y="25" width="450" height="670" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 6" />
  <rect x="35" y="35" width="430" height="650" rx="6" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5" />
  
  <text x="250" y="140" fill="#D4AF37" font-size="18" font-family="Cairo, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="2">دراسة فكرية تحليلية نقدية</text>
  <text x="250" y="230" fill="url(#goldGrad)" font-size="50" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">مغالطات</text>
  <text x="250" y="295" fill="#FFFFFF" font-size="52" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">منطقية</text>
  <text x="250" y="355" fill="#94A3B8" font-size="20" font-family="Cairo, sans-serif" font-weight="700" text-anchor="middle">في الخطاب الحواري والفكر المعاصر</text>

  <!-- Geometric Logic Symbol -->
  <g transform="translate(180, 400)">
    <circle cx="70" cy="60" r="50" fill="none" stroke="#D4AF37" stroke-width="2" />
    <circle cx="70" cy="60" r="35" fill="none" stroke="#FDE047" stroke-width="1" stroke-dasharray="4 4" />
    <polygon points="70,20 105,80 35,80" fill="none" stroke="#D4AF37" stroke-width="2" />
    <line x1="20" y1="60" x2="120" y2="60" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
  </g>

  <line x1="120" y1="570" x2="380" y2="570" stroke="#D4AF37" stroke-width="1" opacity="0.6" />
  <text x="250" y="610" fill="#FFFFFF" font-size="20" font-family="Cairo, sans-serif" font-weight="800" text-anchor="middle">سماحة الشيخ الدكتور كاظم ياسين الحريب</text>
  <text x="250" y="645" fill="#D4AF37" font-size="14" font-family="Cairo, sans-serif" font-weight="600" text-anchor="middle">سلسلة البناء الفكري والرشاد المعرفي</text>
</svg>