<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF4D0" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <radialGradient id="sealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </radialGradient>
  </defs>
  
  <!-- Parchment background -->
  <rect width="800" height="560" fill="#FCFBF7" />
  
  <!-- Outer & Inner Guilloche Frames -->
  <rect x="20" y="20" width="760" height="520" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="6" />
  <rect x="32" y="32" width="736" height="496" rx="4" fill="none" stroke="#800020" stroke-width="2" />
  <rect x="38" y="38" width="724" height="484" rx="2" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 3" />

  <!-- College Crest Logo (Newcastle Business College) -->
  <g transform="translate(360, 50)">
    <circle cx="40" cy="35" r="32" fill="#800020" stroke="#D4AF37" stroke-width="2" />
    <path d="M25 25 L40 12 L55 25 L50 48 L30 48 Z" fill="#D4AF37" />
    <circle cx="40" cy="28" r="6" fill="#800020" />
    <text x="40" y="43" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle" font-family="serif">NBC</text>
  </g>

  <!-- Header -->
  <text x="400" y="140" fill="#800020" font-size="24" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="2">Newcastle Business College</text>
  <text x="400" y="165" fill="#475569" font-size="14" font-family="sans-serif" font-style="italic" text-anchor="middle">United Kingdom - Higher Education &amp; Professional Qualifications</text>

  <line x1="220" y1="180" x2="580" y2="180" stroke="#D4AF37" stroke-width="1.5" />

  <!-- Main Certificate Title -->
  <text x="400" y="215" fill="#0F172A" font-size="28" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">AWARD OF EXCELLENCE</text>
  
  <text x="400" y="250" fill="#64748B" font-size="15" font-family="sans-serif" text-anchor="middle">THIS IS TO CERTIFY THAT</text>
  
  <!-- Recipient Name -->
  <text x="400" y="295" fill="#800020" font-size="30" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Dr Kadem Yassin Ali al huraib</text>
  
  <line x1="250" y1="310" x2="550" y2="310" stroke="#800020" stroke-width="1" opacity="0.5" />

  <!-- Subtitle / Body -->
  <text x="400" y="345" fill="#334155" font-size="16" font-family="Georgia, serif" text-anchor="middle">Having followed all the requirements of the Professional Doctorate in Coaching</text>
  <text x="400" y="375" fill="#0F382C" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">For the Year 2018</text>

  <!-- Golden Seal Stamp at bottom left -->
  <g transform="translate(100, 400)">
    <circle cx="45" cy="45" r="42" fill="url(#sealGrad)" stroke="#A16207" stroke-width="2" />
    <circle cx="45" cy="45" r="34" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="45" y="42" fill="#78350F" font-size="10" font-family="serif" font-weight="bold" text-anchor="middle">OFFICIAL</text>
    <text x="45" y="56" fill="#78350F" font-size="10" font-family="serif" font-weight="bold" text-anchor="middle">SEAL</text>
    <!-- Ribbon tails -->
    <polygon points="30,82 45,72 45,115 30,105" fill="#991B1B" />
    <polygon points="60,82 45,72 45,115 60,105" fill="#991B1B" />
  </g>

  <!-- Signatures and Code -->
  <g transform="translate(550, 420)">
    <path d="M20 20 Q50 -5 90 25 Q130 5 160 20" fill="none" stroke="#1E293B" stroke-width="2" />
    <line x1="10" y1="35" x2="170" y2="35" stroke="#64748B" stroke-width="1" />
    <text x="90" y="50" fill="#475569" font-size="13" font-family="sans-serif" text-anchor="middle">College Chairman</text>
  </g>
  
  <text x='400' y='510' fill='#64748B' font-size='12' font-family='monospace' text-anchor='middle'>Registration / Certificate No: DOC-2018-0914</text>
</svg>