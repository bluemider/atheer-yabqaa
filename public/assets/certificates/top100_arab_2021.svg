<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#FFFDF7" />
  <rect x="25" y="25" width="750" height="510" rx="8" fill="none" stroke="url(#gGold)" stroke-width="4" />
  <rect x="35" y="35" width="730" height="490" rx="6" fill="none" stroke="#1E3A8A" stroke-width="1.5" />

  <text x="400" y="90" fill="#1E3A8A" font-size="20" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">البرنامج الدولي لتكريم أفضل 100 شخصية متميزة ومؤثرة</text>
  <text x="400" y="120" fill="#D4AF37" font-size="16" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">في مصر والوطن العربي وأفريقيا لعام 2021</text>
  <line x1="200" y1="135" x2="600" y2="135" stroke="#D4AF37" stroke-width="1.5" />

  <text x="400" y="175" fill="#475569" font-size="16" font-family="Cairo, sans-serif" text-anchor="middle">وذلك لمجهوداته المتميزة ومشاركاته الفعالة في الأنشطة والمبادرات التنموية</text>
  <text x="400" y="205" fill="#64748B" font-size="16" font-family="Cairo, sans-serif" text-anchor="middle">وبناءً على ذلك تم منح السيد</text>

  <text x="400" y="260" fill="#B91C1C" font-size="32" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">الدكتور / كاظم ياسين علي الحريب</text>
  <line x1="240" y1="275" x2="560" y2="275" stroke="#B91C1C" stroke-width="1" opacity="0.6" />

  <text x="400" y="320" fill="#1E3A8A" font-size="22" font-family="Cairo, sans-serif" font-weight="800" text-anchor="middle">لقب «أفضل شخصية متميزة لعام 2021»</text>
  <text x="400" y="355" fill="#334155" font-size="16" font-family="Cairo, sans-serif" text-anchor="middle">باعتباره من الشخصيات الإبداعية والمتطورة في خدمة المجتمع والإنسانية</text>

  <!-- Embossed Medal -->
  <g transform="translate(120, 390)">
    <circle cx="40" cy="40" r="38" fill="url(#gGold)" />
    <circle cx="40" cy="40" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <text x="40" y="46" fill="#78350F" font-size="12" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">أفضل 100</text>
  </g>

  <g transform="translate(560, 420)">
    <path d="M20 20 Q50 0 90 20 Q120 40 150 20" fill="none" stroke="#0F172A" stroke-width="2" />
    <text x="85" y="50" fill="#475569" font-size="14" font-family="Cairo, sans-serif" text-anchor="middle">رئيس اللجنة الدولية للتحكيم</text>
  </g>
</svg>