<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#FCFBF7" />
  <rect x="25" y="25" width="750" height="510" rx="8" fill="none" stroke="url(#pGold)" stroke-width="4" />
  <rect x="35" y="35" width="730" height="490" rx="6" fill="none" stroke="#0F382C" stroke-width="1.5" />

  <text x="400" y="90" fill="#0F382C" font-size="24" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">ملتقى الحب والامتنان | LOVE AND GRATITUDE</text>
  <text x="400" y="120" fill="#B45309" font-size="16" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">نيوكاسل بيزنس كوليدج البريطانية تمنح شهادة تقدير فخرية</text>
  <line x1="220" y1="135" x2="580" y2="135" stroke="#D4AF37" stroke-width="1.5" />

  <text x="400" y="180" fill="#991B1B" font-size="22" font-family="Cairo, sans-serif" font-weight="800" text-anchor="middle">بنيشان العزيمة والإنجاز</text>
  <text x="400" y="215" fill="#475569" font-size="16" font-family="Cairo, sans-serif" text-anchor="middle">تتشرف بمنح هذه الشهادة لسماحة الدكتور</text>

  <text x="400" y="270" fill="#0F382C" font-size="34" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">كاظم يس الحريب</text>
  <line x1="250" y1="285" x2="550" y2="285" stroke="#D4AF37" stroke-width="1.5" />

  <text x="400" y="330" fill="#B45309" font-size="22" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">«سفير المحبة والسلام لعام 2022م»</text>
  <text x="400" y="365" fill="#334155" font-size="16" font-family="Cairo, sans-serif" text-anchor="middle">تقديراً لجهوده المتميزة ومسؤوليته التي تحملها في بناء جيل واعٍ متآلف، ومبادراته في التلاحم المجتمعي</text>

  <g transform="translate(120, 395)">
    <circle cx="40" cy="40" r="36" fill="url(#pGold)" />
    <text x="40" y="46" fill="#78350F" font-size="12" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">وسام السلام</text>
  </g>

  <g transform="translate(560, 420)">
    <text x="80" y="30" fill="#1E293B" font-size="16" font-family="cursive" text-anchor="middle">Certified &amp; Approved</text>
    <text x="80" y="50" fill="#64748B" font-size="13" font-family="Cairo, sans-serif" text-anchor="middle">أمانة المؤتمر العام</text>
  </g>
