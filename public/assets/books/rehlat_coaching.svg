<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDC40" />
      <stop offset="50%" stop-color="#FBCB1A" />
      <stop offset="100%" stop-color="#F4BA08" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="720" rx="12" fill="url(#bgGrad)" />
  
  <!-- Book spine accent -->
  <rect x="0" y="0" width="28" height="720" fill="#E5A800" opacity="0.6" />
  <line x1="28" y1="0" x2="28" y2="720" stroke="#CA9200" stroke-width="2" />

  <!-- Top Ribbon: الطبعة 1 -->
  <rect x="45" y="0" width="42" height="75" rx="2" fill="#CC181E" />
  <text x="66" y="42" fill="#FFFFFF" font-size="14" font-family="Cairo, sans-serif" font-weight="bold" text-anchor="middle">الطبعة</text>
  <text x="66" y="64" fill="#FFFFFF" font-size="18" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">1</text>

  <!-- Title Section -->
  <text x="260" y="165" fill="#CC181E" font-size="36" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">رحلة في</text>
  <text x="260" y="225" fill="#CC181E" font-size="44" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">عالم الكوتشينج</text>
  <text x="260" y="275" fill="#1E293B" font-size="22" font-family="Cairo, sans-serif" font-weight="700" text-anchor="middle">بين التجربة والتطبيق</text>

  <!-- Golden Carriage with Horse Graphic Artwork -->
  <g transform="translate(80, 310)">
    <!-- Horse -->
    <path d="M240 180 C235 150 250 110 270 95 C280 88 300 70 305 50 C310 65 315 80 320 85 C325 82 335 78 335 88 C330 100 315 110 310 130 C305 150 320 180 315 210 L305 210 L300 170 L285 210 L275 210 L275 165 L260 210 L250 210 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
    <path d="M290 85 C295 90 290 105 285 110" stroke="#64748B" stroke-width="3" fill="none" />
    <!-- Harness and red saddle straps -->
    <path d="M280 115 L260 140 L230 145" stroke="#991B1B" stroke-width="3" fill="none" />
    <path d="M275 130 C270 145 280 155 295 155" stroke="#991B1B" stroke-width="4" fill="none" />

    <!-- Royal Carriage Body -->
    <rect x="30" y="50" width="150" height="100" rx="15" fill="#EAB308" stroke="#A16207" stroke-width="3" />
    <!-- Ornate Carriage Roof -->
    <path d="M20 50 C40 15 170 15 190 50 Z" fill="#FDE047" stroke="#A16207" stroke-width="3" />
    <!-- Crown on top -->
    <path d="M95 18 L105 5 L115 15 L125 5 L135 18 Z" fill="#D97706" stroke="#78350F" stroke-width="1.5" />
    <circle cx="115" cy="3" r="4" fill="#EF4444" />
    
    <!-- Carriage Windows -->
    <rect x="50" y="65" width="45" height="55" rx="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
    <rect x="115" y="65" width="45" height="55" rx="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
    <line x1="72" y1="65" x2="72" y2="120" stroke="#CA8A04" stroke-width="1.5" />
    <line x1="137" y1="65" x2="137" y2="120" stroke="#CA8A04" stroke-width="1.5" />

    <!-- Big Wheels -->
    <circle cx="45" cy="170" r="38" fill="none" stroke="#A16207" stroke-width="4" />
    <circle cx="45" cy="170" r="8" fill="#78350F" />
    <!-- Spokes -->
    <line x1="45" y1="132" x2="45" y2="208" stroke="#A16207" stroke-width="2" />
    <line x1="7" y1="170" x2="83" y2="170" stroke="#A16207" stroke-width="2" />
    <line x1="18" y1="143" x2="72" y2="197" stroke="#A16207" stroke-width="2" />
    <line x1="72" y1="143" x2="18" y2="197" stroke="#A16207" stroke-width="2" />

    <!-- Small Front Wheel -->
    <circle cx="155" cy="175" r="28" fill="none" stroke="#A16207" stroke-width="4" />
    <circle cx="155" cy="175" r="6" fill="#78350F" />
    <line x1="155" y1="147" x2="155" y2="203" stroke="#A16207" stroke-width="2" />
    <line x1="127" y1="175" x2="183" y2="175" stroke="#A16207" stroke-width="2" />

    <!-- Connection shaft to horse -->
    <line x1="175" y1="160" x2="265" y2="150" stroke="#991B1B" stroke-width="3" />
  </g>

  <!-- Author Name -->
  <text x="250" y="610" fill="#1E293B" font-size="21" font-family="Cairo, sans-serif" font-weight="800" text-anchor="middle">د. كاظم ياسين علي الحريب</text>

  <!-- Publisher Logo at Bottom Right -->
  <g transform="translate(390, 640)">
    <rect x="0" y="0" width="65" height="45" rx="5" fill="#FFFFFF" stroke="#0F382C" stroke-width="1.5" />
    <text x="32" y="22" fill="#0F382C" font-size="12" font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle">كنان</text>
    <text x="32" y="37" fill="#1E293B" font-size="9" font-family="Cairo, sans-serif" font-weight="600" text-anchor="middle">DAR KINAN</text>
  </g>
</svg>